services:
  postgres:
    image: postgres:17-alpine
    container_name: leetcode-application
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}

    ports:
      - "${POSTGRES_PORT}:5432"